{% extends "creds/navbar.html" %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="container my-4">
        <div class="row col-md-8 pt-2">
            <h1>Login</h1>
        </div>
        <div class="row col-8">{% crispy form %}</div>
        <div class="row col-md-8 pt-2 px-3">
            <small>
                <i>
                    Trouble?
                    <br />
                    <a href="{% url 'creds:user_register' %}">Register new account</a>
                    <br />
                    <a href="{% url 'creds:password_reset' %}">Forgot password</a>
                </i>
            </small>
            <br />
        </div>
    </div>
{% endblock content %}
